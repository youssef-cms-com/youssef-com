name: Month Reset Regression
on:
  push:
    branches:
      - feature/reset-month-deliveries-spend-20261123
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py server.py
      - run: python tests/test_month_reset.py
      - run: python tests/test_expedition_pending.py
      - run: python tests/test_review_sync.py
      - run: python tests/test_missing_product_quick_add.py
